name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HypertrophyApp.slnx

      - name: Build
        run: dotnet build HypertrophyApp.slnx --no-restore --configuration Release

      # Integration tests start a real PostgreSQL container through Testcontainers (Docker is preinstalled on the runner).
      - name: Test
        run: dotnet test HypertrophyApp.slnx --no-build --configuration Release --logger "console;verbosity=normal"
